# Linters en plus du jeu standard.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - bodyclose
    - misspell
    - unconvert
    - nilerr
    - forbidigo
  settings:
    forbidigo:
      # Résolution par types : un alias d'import ou une variable d'interface ne contourne pas la règle.
      analyze-types: true
      forbid:
        # Invariant I1 : seul fsys.Registry.WriteRoot ouvre une racine d'écriture, après le contrôle des bibliothèques.
        - pattern: '^fsys\.Volume\.OpenWriteRoot$'
          msg: only fsys.Registry.WriteRoot opens a write root
        # Même règle par le type concret du volume SFTP : un *sftpfs.Volume tenu en main ne passe pas par l'interface.
        - pattern: '^sftpfs\.Volume\.OpenWriteRoot$'
          pkg: '^necromanciarr/internal/fsys/sftpfs$'
          msg: only fsys.Registry.WriteRoot opens a write root
        # Invariant I1 : hors de internal/fsys et internal/store, toute écriture disque passe par une fsys.WriteRoot
        # (doublé, dans linker, pipeline, dedupe et repair, par des tests qui interdisent l'import de os).
        - pattern: '^os\.(Link|Symlink|WriteFile|Rename|Remove|RemoveAll|Mkdir|MkdirAll|MkdirTemp|Create|CreateTemp|OpenFile|OpenRoot|Chmod|Chown|Lchown|Truncate|Chtimes|CopyFS)$'
          pkg: '^os$'
          msg: write to disk only through fsys.WriteRoot (fsys.Registry.WriteRoot)
        # Méthodes d'écriture d'un *os.File : un fichier ouvert ailleurs ne doit pas servir de porte dérobée.
        - pattern: '^os\.File\.(Chmod|Chown|Truncate|Write|WriteAt|WriteString|ReadFrom)$'
          pkg: '^os$'
          msg: write to disk only through fsys.WriteRoot (fsys.Registry.WriteRoot)
        - pattern: '^ioutil\.(WriteFile|TempFile|TempDir)$'
          pkg: '^io/ioutil$'
          msg: write to disk only through fsys.WriteRoot (fsys.Registry.WriteRoot)
        # Appels système qui modifient le disque : seul le volume local les emploie (hardlink confiné).
        - pattern: '^(syscall|unix)\.(Unlink|Unlinkat|Rename|Renameat|Renameat2|Link|Linkat|Symlink|Symlinkat|Mkdir|Mkdirat|Rmdir|Chmod|Fchmod|Fchmodat|Chown|Fchown|Truncate|Ftruncate|Utimes|UtimesNano|UtimesNanoAt|Creat)$'
          pkg: '^(syscall|golang\.org/x/sys/unix)$'
          msg: mutate the disk by system call only inside internal/fsys/local
        # Un programme externe pourrait écrire n'importe où : seul le client rclone en lance un.
        - pattern: '^exec\.(Command|CommandContext)$'
          pkg: '^os/exec$'
          msg: run external programs only from internal/hashsource/rclone.go
        # La clé d'hôte SSH est toujours vérifiée (knownHosts) : aucune exception, tests compris.
        - pattern: '^ssh\.InsecureIgnoreHostKey$'
          pkg: '^golang\.org/x/crypto/ssh$'
          msg: host keys are always checked against knownHosts
        # Les commandes distantes (liste fermée, en lecture seule) ne partent que de internal/fsys/sftpfs/exec.go ;
        # la règle prend effet dès que ce fichier et le paquet x/crypto/ssh sont utilisés (tâches SFTP).
        - pattern: '^ssh\.Session\.(Run|Start|Output|CombinedOutput|Shell|RequestSubsystem)$'
          pkg: '^golang\.org/x/crypto/ssh$'
          msg: remote commands run only from internal/fsys/sftpfs/exec.go
        # Ouvrir une session SSH est déjà le premier pas d'une commande distante.
        - pattern: '^ssh\.(Client\.)?NewSession$'
          pkg: '^golang\.org/x/crypto/ssh$'
          msg: remote commands run only from internal/fsys/sftpfs/exec.go
  exclusions:
    rules:
      # Le volume local et l'outillage de test des volumes (fsystest, serveur SFTP de test) implémentent les écritures ;
      # la base SQLite écrit son propre fichier.
      - path: '^internal/(fsys/(local|fsystest|sftpfs/sftptest)|store)/'
        linters: [forbidigo]
        text: write to disk only through
      # Tests qui posent leurs fixtures sur le disque, paquet par paquet (liste explicite, jamais internal/**).
      - path: '^(cmd/necromanciarr|internal/(app|config|crossseed|dedupe|doctor|hashsource|library|linker|pipeline|repair|web))/[^/]+_test\.go$'
        linters: [forbidigo]
        text: write to disk only through
      # Les volumes et leur suite de conformité implémentent ou éprouvent OpenWriteRoot.
      - path: '^internal/fsys/'
        linters: [forbidigo]
        text: only fsys.Registry.WriteRoot
      # Volume de test qui relaie OpenWriteRoot au volume local enveloppé ; seul le registre l'appelle.
      - path: '^internal/pipeline/registry_test\.go$'
        linters: [forbidigo]
        text: only fsys.Registry.WriteRoot
      # Hardlink confiné du volume local (linkat depuis le handle du parent).
      - path: '^internal/fsys/local/hardlink_unix\.go$'
        linters: [forbidigo]
        text: mutate the disk by system call only
      # Client rclone : seul lanceur de programme externe (lecture d'empreintes).
      - path: '^internal/hashsource/rclone\.go$'
        linters: [forbidigo]
        text: run external programs only from
      # Tests de shellquote : aller-retour par /bin/sh local, sans donnée externe.
      - path: '^internal/fsys/sftpfs/shellquote/[^/]+_test\.go$'
        linters: [forbidigo]
        text: run external programs only from
      # Seul point d'envoi des commandes distantes.
      - path: '^internal/fsys/sftpfs/exec\.go$'
        linters: [forbidigo]
        text: remote commands run only from
# gofumpt et goimports tournent via make fmt / make imports (même version épinglée dans go.mod).
