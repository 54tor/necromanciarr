name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      # Version alignée sur l'image de l'étape ui du Dockerfile.
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26.13.1
      # Une seule étape : la même pile que le hook pre-push.
      - run: make quality
  # Binaires des cinq plateformes puis image des trois architectures, sans push ni émulation.
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3.11.1
      - run: make cross-build
      - run: make docker-buildx
  # Tests des paquets qui touchent aux chemins et aux liens, sur un vrai Windows (cross-build ne fait que compiler).
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/linker/... ./internal/config/... ./internal/pipeline/...
