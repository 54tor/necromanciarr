name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      # Une seule étape : la même pile que le hook pre-push.
      - run: make quality
  # Binaires des cinq plateformes puis image des trois architectures, sans push ni émulation.
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3.11.1
      - run: make cross-build
      - run: make docker-buildx
