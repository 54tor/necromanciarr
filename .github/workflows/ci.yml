name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      # Une seule étape : la même pile que le hook pre-push.
      - run: make quality
